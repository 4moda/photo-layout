name: PhotoLayout
options:
  bundleIdPrefix: com.fourmoda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PhotoLayoutCore:
    path: Packages/PhotoLayoutCore

targets:
  PhotoLayout:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PhotoLayoutCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhotoLayout
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: 作成した画像をカメラロールに保存するために使用します。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourmoda.photolayout
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - PhotoLayoutTests
        - PhotoLayoutUITests

  PhotoLayoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests/PhotoLayoutTests]
    dependencies:
      - target: PhotoLayout
    settings:
      base:
        SWIFT_VERSION: "5.0"

  PhotoLayoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppTests/PhotoLayoutUITests]
    dependencies:
      - target: PhotoLayout
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: PhotoLayout
