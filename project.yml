name: PhotoLayout
options:
  bundleIdPrefix: com.fourmoda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

packages:
  PhotoLayoutCore:
    path: Packages/PhotoLayoutCore

targets:
  PhotoLayout:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PhotoLayoutCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhotoLayout
        CFBundleLocalizations: [ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: 作成した画像をカメラロールに保存するために使用します。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourmoda.photolayout
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - PhotoLayoutTests
        - PhotoLayoutUITests

  PhotoLayoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests/PhotoLayoutTests]
    dependencies:
      - target: PhotoLayout
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  PhotoLayoutUITests:
    type: bundle.ui-testing
    platform: iOS
    # スクショ運用ツール（fastlane/tools）はこのUITestに属するが、テストバンドルの
    # ソース/リソースには含めない（XcodeGenのソース走査から除外）。
    sources:
      - path: AppTests/PhotoLayoutUITests
        excludes:
          - "fastlane/**"
          - "tools/**"
    dependencies:
      - target: PhotoLayout
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: PhotoLayout
        GENERATE_INFOPLIST_FILE: YES
