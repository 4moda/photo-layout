name: Appetize Deploy

# シミュレータ向けビルドを Appetize.io にアップロードし、ブラウザで動作確認できるようにする
# （Macなし開発で「シミュレータを触る」手段。photo-sheet と同じ構成）。
# 必要な Secrets:
#   APPETIZE_API_TOKEN  … Appetize のアカウントページで発行した API トークン（必須）
#   APPETIZE_PUBLIC_KEY … 初回アップロードで発行される publicKey（設定すると同じ URL を更新し続ける）
# 「テスト → デプロイ」の順序を保証する: main への push で ios-ci が成功した後にだけ走る。
# テストが赤いビルドを Appetize に上げないためのゲート。手動実行も可能。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ios-ci"]
    types: [completed]
    branches: [main]

# 最小権限。他ワークフロー（core-tests）の結論参照のため actions: read を付与。
permissions:
  contents: read
  actions: read

concurrency:
  group: appetize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & upload to Appetize
    runs-on: macos-26
    timeout-minutes: 40
    # 手動実行、または ios-ci が成功したときのみ実行（失敗/キャンセル時はスキップ）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # workflow_run 起動時は既定でデフォルトブランチHEADを取るため、
      # ios-ci が回した実際のコミットを明示的にチェックアウトする。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # ios-ci（workflow_run 起動条件）に加え、同一コミットで core-tests も成功していることを要求。
      # App は PhotoLayoutCore をリンクするためコンパイル不備は ios-ci で落ちるが、
      # 「コンパイルは通るが Core のロジックテストが落ちる」ケースをここで塞ぐ。
      - name: Gate on core-tests (same commit)
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow core-tests \
            --branch main --json headSha,conclusion \
            --jq "[.[] | select(.headSha==\"$SHA\")][0].conclusion // \"missing\"")
          echo "core-tests($SHA) = $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::core-tests がこのコミットで成功していません（=$conclusion）。Appetize デプロイを中止します。"
            exit 1
          fi

      - name: Check secret
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "::error::APPETIZE_API_TOKEN secret が未設定です。Appetize.io で API トークンを発行し、リポジトリの Secrets に登録してください。"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip .app bundle
        run: |
          cd DerivedData/Build/Products/Release-iphonesimulator || exit 1
          zip -qry "$GITHUB_WORKSPACE/PhotoLayout-simulator.zip" PhotoLayout.app

      - name: Upload to Appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            URL="https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY"
          else
            URL="https://api.appetize.io/v1/apps"
          fi
          RESPONSE=$(curl -sS -f -u "$APPETIZE_API_TOKEN:" "$URL" \
            -F "file=@PhotoLayout-simulator.zip" \
            -F "platform=ios")
          PUBLIC_KEY=$(echo "$RESPONSE" | jq -r '.publicKey')
          echo "publicKey=$PUBLIC_KEY"
          echo "appUrl=https://appetize.io/app/$PUBLIC_KEY"
          {
            echo "## Appetize デプロイ完了 🎉"
            echo ""
            echo "- **ブラウザで開く**: https://appetize.io/app/$PUBLIC_KEY"
            echo "- publicKey: \`$PUBLIC_KEY\`"
            if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
              echo ""
              echo "> 次回以降も同じ URL を使うには、この publicKey をリポジトリ Secret \`APPETIZE_PUBLIC_KEY\` に登録してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
