name: ios-ci

# ドキュメントのみの変更では高コストな macOS ビルドを回さない（App挙動に影響しないため）。
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']

# 最小権限（コードの読み取りのみ）。artifactアップロードはランタイムトークンで動作する。
permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # macos-15イメージのXcodeを明示固定（"latest"任せによるシミュレータランタイム不整合を防ぐ）
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 16

jobs:
  build-test:
    name: iOS Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      # コンパイルエラーを最短で検知するため、テスト実行とは分けて先にビルドする
      - name: Build for testing (simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:PhotoLayoutTests \
            -resultBundlePath TestResults.xcresult \
            | tee test.log

      # UITestのビルド成果物（.app/.xctest/.xctestrun）はscreenshotsジョブ（機種matrix）で
      # test-without-buildingとして再利用する。tarはzip系artifact実装より実行ビットや
      # シンボリックリンクの保存が確実なため、自前でアーカイブしてから1ファイルとしてアップロードする。
      # Build/Products配下だけで足り、容量の大きいIntermediates.noindexは含めない。
      - name: Package built test products (for screenshots matrix)
        if: always()
        run: |
          mkdir -p artifact
          tar -C DerivedData/Build/Products -czf artifact/build-products.tar.gz .

      - name: Upload built test products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: artifact/build-products.tar.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            build.log
            test.log
          if-no-files-found: ignore

      # Sideloadly/AltStoreで手動サイドロードするためのunsignedビルド。
      # 署名はインストール時にユーザーの無料Apple IDで行われるため、CIでは署名しない。
      # 実機用成果物は main への push でのみ生成する（PRのフィードバックを速くする）。
      - name: Build unsigned device app (Release)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          xcodebuild build \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee device-build.log

      - name: Package unsigned .ipa
        if: github.event_name == 'push'
        run: |
          APP_PATH="DerivedDataDevice/Build/Products/Release-iphoneos/PhotoLayout.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PhotoLayout-unsigned.ipa Payload

      - name: Upload unsigned .ipa
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLayout-unsigned-ipa
          path: PhotoLayout-unsigned.ipa

  # 機種×テーマ（ライト/ダーク）ごとに独立したジョブでfastlane snapshotを実行する（並列化）。
  # build-testでビルド済みのBuild/Productsを artifact 経由で使い回し、機種・テーマごとの
  # 再ビルドはしない（Swift再コンパイルは数分かかるが、ビルド成果物はどちらにも依存しないため）。
  # GitHub Actionsのmatrixは複数軸を書くと自動でクロス積になる（2機種×2テーマ=4並列ジョブ）。
  screenshots:
    name: Screenshots (${{ matrix.device.label }} / ${{ matrix.theme.name }})
    needs: build-test
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: iPhone 16
            label: iPhone 16
            slug: iphone-16
          - name: iPhone SE (3rd generation)
            label: iPhone SE 3rd gen
            slug: iphone-se-3rd-gen
        theme:
          # light: ダークモード用の1メソッド（testDarkModeSpotCheck）だけ除外して残り全部を撮る。
          - name: light
            onlyTesting: ""
            skipTesting: PhotoLayoutUITests/ScreenshotSmokeTests/testDarkModeSpotCheck
          # dark: 逆にそのメソッドだけを撮る（他の軽量な巡回テストは走らせない）。
          - name: dark
            onlyTesting: PhotoLayoutUITests/ScreenshotSmokeTests/testDarkModeSpotCheck
            skipTesting: ""
    env:
      # DEVELOPER_DIRはworkflow直下のenv(Xcode 16.4固定)をそのまま継承する。
      # Snapfile側でこれらの環境変数を読み、このジョブが担当する機種・テストだけに絞り込む。
      SNAPSHOT_DEVICES: ${{ matrix.device.name }}
      SNAPSHOT_ONLY_TESTING: ${{ matrix.theme.onlyTesting }}
      SNAPSHOT_SKIP_TESTING: ${{ matrix.theme.skipTesting }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # .xcodeprojはgitignore対象（project.ymlから都度生成）。ビルド成果物のみ使い回すため
      # プロジェクトファイル自体はこのジョブでも生成し直す（コンパイルは発生せず高速）。
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download built test products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: artifact

      - name: Extract built test products
        run: |
          mkdir -p DerivedData/Build/Products
          tar -C DerivedData/Build/Products -xzf artifact/build-products.tar.gz

      # 各操作を自動撮影し screenshots.html を生成（標準ツール fastlane snapshot）。
      # Macを持たない開発者が実際の画面を確認する手段。設定は fastlane/Snapfile。
      # fastlane/tools は UITest 配下に置く（AppTests/PhotoLayoutUITests）。
      # そこをCWDにして実行する（Snapfileのパスは ../../ でリポジトリ直下を参照）。
      - name: Capture screenshots (fastlane snapshot)
        working-directory: AppTests/PhotoLayoutUITests
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane snapshot

      - name: Upload screenshots (${{ matrix.device.slug }} / ${{ matrix.theme.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device.slug }}-${{ matrix.theme.name }}
          path: AppTests/PhotoLayoutUITests/fastlane/screenshots
          if-no-files-found: ignore
          retention-days: 1

  # 全機種×テーマ分のscreenshots-*artifactを1つにマージしてindex.htmlを生成する。
  # PRではその場でCloudflare Pagesへプレビューデプロイし、GitHub Actionsの成果物としては
  # 一切残さない（レビュアーがartifactをダウンロード・展開する手間をなくすのが目的。#32）。
  # Xcode不要なのでubuntu-latestで十分。
  screenshots-index:
    name: Merge screenshots & deploy preview
    needs: screenshots
    if: always()
    runs-on: ubuntu-latest
    # cloudflare/pages-actionがデプロイステータス・PRコメントを書き込むために必要。
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all device screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: screenshots
          merge-multiple: true

      # 画面ID/機能ID/言語/端末/テーマで絞り込める一覧 index.html を生成（fastlane出力の見せ方を補強）。
      - name: Build filterable screenshot index
        run: python3 AppTests/PhotoLayoutUITests/tools/build_screenshot_index.py screenshots

      # Cloudflareのアカウント・Pagesプロジェクト・Zero Trust Accessポリシー（GitHub OAuth SSO）は
      # 人間が事前に用意する前提（CIでは完結しない）。Secrets未設定の間は静かにスキップし、
      # 通常のPR（Cloudflare未設定のPR）を赤くしない。設定後に本物のエラー（トークン誤りなど）が
      # 出た場合はこのステップ自体が失敗して知らせる。
      - name: Check Cloudflare secrets
        id: cf_check
        env:
          CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_SET" = "true" ] && [ "$CF_ACCOUNT_SET" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID が未設定のため、スクショのCloudflare Pagesプレビューをスキップします。"
          fi

      # レビュー用プレビュー。PRごとに branch=pr-<番号> で同一Pagesプロジェクト内へデプロイし、
      # 常に https://pr-<番号>.<project>.pages.dev が最新を指す（push毎に上書き）。
      - name: Deploy screenshots to Cloudflare Pages (PR preview)
        if: github.event_name == 'pull_request' && steps.cf_check.outputs.configured == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: photolayout-screenshots
          directory: screenshots
          branch: pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
