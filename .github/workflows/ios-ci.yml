name: ios-ci

# ドキュメントのみの変更では高コストな macOS ビルドを回さない（App挙動に影響しないため）。
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']

# 最小権限（コードの読み取りのみ）。artifactアップロードはランタイムトークンで動作する。
permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # macos-15イメージのXcodeを明示固定（"latest"任せによるシミュレータランタイム不整合を防ぐ）
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 16

jobs:
  build-test:
    name: iOS Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      # コンパイルエラーを最短で検知するため、テスト実行とは分けて先にビルドする
      - name: Build for testing (simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:PhotoLayoutTests \
            -resultBundlePath TestResults.xcresult \
            | tee test.log

      # 各操作を自動撮影し screenshots.html を生成（標準ツール fastlane snapshot）。
      # Macを持たない開発者が実際の画面を確認する手段。設定は fastlane/Snapfile。
      # fastlane/tools は UITest 配下に置く（AppTests/PhotoLayoutUITests）。
      # そこをCWDにして実行する（Snapfileのパスは ../../ でリポジトリ直下を参照）。
      - name: Capture screenshots (fastlane snapshot)
        if: always()
        working-directory: AppTests/PhotoLayoutUITests
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane snapshot

      # 画面ID/機能ID/言語/端末で絞り込める一覧 index.html を生成（fastlane出力の見せ方を補強）。
      - name: Build filterable screenshot index
        if: always()
        run: python3 AppTests/PhotoLayoutUITests/tools/build_screenshot_index.py AppTests/PhotoLayoutUITests/fastlane/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: AppTests/PhotoLayoutUITests/fastlane/screenshots
          if-no-files-found: ignore

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            build.log
            test.log
          if-no-files-found: ignore

      # Sideloadly/AltStoreで手動サイドロードするためのunsignedビルド。
      # 署名はインストール時にユーザーの無料Apple IDで行われるため、CIでは署名しない。
      # 実機用成果物は main への push でのみ生成する（PRのフィードバックを速くする）。
      - name: Build unsigned device app (Release)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          xcodebuild build \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee device-build.log

      - name: Package unsigned .ipa
        if: github.event_name == 'push'
        run: |
          APP_PATH="DerivedDataDevice/Build/Products/Release-iphoneos/PhotoLayout.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PhotoLayout-unsigned.ipa Payload

      - name: Upload unsigned .ipa
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLayout-unsigned-ipa
          path: PhotoLayout-unsigned.ipa
