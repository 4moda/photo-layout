name: ios-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # macos-15イメージのXcodeを明示固定（"latest"任せによるシミュレータランタイム不整合を防ぐ）
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 16

jobs:
  build-test:
    name: iOS Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      # コンパイルエラーを最短で検知するため、テスト実行とは分けて先にビルドする
      - name: Build for testing (simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:PhotoLayoutTests \
            -resultBundlePath TestResults.xcresult \
            | tee test.log

      # 各操作を自動撮影し screenshots.html を生成（標準ツール fastlane snapshot）。
      # Macを持たない開発者が実際の画面を確認する手段。設定は fastlane/Snapfile。
      - name: Capture screenshots (fastlane snapshot)
        if: always()
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane snapshot

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/screenshots
          if-no-files-found: ignore

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            build.log
            test.log
          if-no-files-found: ignore

      # Sideloadly/AltStoreで手動サイドロードするためのunsignedビルド。
      # 署名はインストール時にユーザーの無料Apple IDで行われるため、CIでは署名しない。
      - name: Build unsigned device app (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PhotoLayout.xcodeproj \
            -scheme PhotoLayout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee device-build.log

      - name: Package unsigned .ipa
        run: |
          APP_PATH="DerivedDataDevice/Build/Products/Release-iphoneos/PhotoLayout.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PhotoLayout-unsigned.ipa Payload

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLayout-unsigned-ipa
          path: PhotoLayout-unsigned.ipa
